<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="kreeper-grid-hero" content="theme.py sizes this iframe by this marker">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tanner Holograms</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&family=Oswald:wght@500;600;700&family=Orbitron:wght@600;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<style>
/* the Kreeper Grid: Home's hero, rendered inside a Streamlit component iframe */
html,body{ margin:0; height:100%; background:#000105; overflow:hidden; }
.stage{ position:relative; width:100%; height:100%; border-radius:12px; overflow:hidden; background:#000105;
  box-shadow:inset 0 0 0 1px rgba(90,209,255,.35), inset 0 0 40px rgba(59,111,209,.15); }
.stage::before, .stage::after{ content:""; position:absolute; width:20px; height:20px; border:2px solid #5ad1ff; z-index:3; pointer-events:none; filter:drop-shadow(0 0 4px #5ad1ff); }
.stage::before{ left:8px; top:8px; border-right:0; border-bottom:0; } .stage::after{ right:8px; bottom:8px; border-left:0; border-top:0; }
.stage canvas{ display:block; width:100% !important; height:100% !important; cursor:grab; }
@media (max-width:700px){ .tag{ display:none; } }
.tag{ position:absolute; left:16px; bottom:12px; z-index:4; font:600 10px Orbitron,sans-serif; letter-spacing:.14em; color:#8fd8ff; text-transform:uppercase; opacity:.75; pointer-events:none; }
</style>
</head>
<body>
<div class="stage" data-take="combo" data-holo="cyan" aria-label="Playoff odds as towers on the Grid, with last season's champion projected behind them"><span class="tag">__TAG__</span></div>
<script>
const D = __DATA__;
const CHAMP = __CHAMP__;
const easeBack = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const ease = t => 1 - Math.pow(1 - t, 3);
const CY = 0x5ad1ff, ROY = 0x3b6fd1, GOLD = 0xf0c35e, DIM = 0x56689a;
const PO = __PO__;
const colOf = (d, i) => d.me ? GOLD : i < PO ? CY : DIM;
const hex = c => '#' + c.toString(16).padStart(6, '0');
const X = i => (i - (D.length - 1) / 2) * 1.6 + (i >= PO ? .55 : -.55);
const H = d => Math.max(.12, d.po / 100 * 4.4);
let seed = 11; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function onVisible(el, start, stop){
  let vis = false; const set = v => { if (v === vis) return; vis = v; v ? start() : stop(); };
  const check = () => { const r = el.getBoundingClientRect(), h = innerHeight; set(r.bottom > h * .1 && r.top < h * .9); };
  if ('IntersectionObserver' in window) new IntersectionObserver(es => es.forEach(e => set(e.isIntersecting)), {threshold:.2}).observe(el);
  addEventListener('scroll', check, {passive:true}); addEventListener('resize', check); requestAnimationFrame(check);
}
function canvasTex(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }
function faceTex(src, ring){
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const t = new THREE.CanvasTexture(c);
  const img = new Image(); img.onload = () => { g.save(); g.beginPath(); g.arc(128,128,112,0,Math.PI*2); g.clip(); g.drawImage(img,16,16,224,224); g.restore();
    g.lineWidth = 12; g.strokeStyle = ring; g.beginPath(); g.arc(128,128,116,0,Math.PI*2); g.stroke(); t.needsUpdate = true; };
  img.src = src; return t;
}
function textTex(txt, color, font){ return canvasTex(256, 96, g => { g.font = font || '58px Orbitron'; g.fillStyle = color; g.textAlign = 'center';
  g.textBaseline = 'middle'; g.shadowColor = color; g.shadowBlur = 16; g.fillText(txt, 128, 50); }); }
function pillTex(pct, name, ring){ return canvasTex(320, 150, (g, w, h) => {
  const r = 26, x = 14, y = 10, ww = w - 28, hh = h - 20;
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + ww, y, x + ww, y + hh, r); g.arcTo(x + ww, y + hh, x, y + hh, r); g.arcTo(x, y + hh, x, y, r); g.arcTo(x, y, x + ww, y, r); g.closePath();
  g.fillStyle = 'rgba(2,4,12,.86)'; g.fill(); g.lineWidth = 4; g.strokeStyle = ring; g.shadowColor = ring; g.shadowBlur = 10; g.stroke(); g.shadowBlur = 0;
  g.fillStyle = '#ffffff'; g.font = '76px Anton'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillText(pct, w / 2, 92);
  g.fillStyle = ring; g.font = '600 26px Orbitron'; g.fillText(name.toUpperCase(), w / 2, 128); }); }
function sprite(tex, w, h, opts){ const s = new THREE.Sprite(new THREE.SpriteMaterial(Object.assign({map:tex, transparent:true, fog:false, depthWrite:false}, opts || {}))); s.scale.set(w, h, 1); return s; }

/* ---------- the Grid every take stands on ---------- */
function gridWorld(scene, o){
  o = o || {};
  scene.background = new THREE.Color(0x000105); scene.fog = new THREE.Fog(0x000105, 14, o.far || 46);
  const gt = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#00030c'; g.fillRect(0, 0, w, h);
    g.shadowColor = o.line || '#3b9cff'; g.shadowBlur = 10; g.strokeStyle = o.line || '#3b9cff'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, w - 3, h - 3);
    g.shadowBlur = 0; g.strokeStyle = 'rgba(90,209,255,.18)'; g.lineWidth = 1; g.strokeRect(w / 2, 0, 0, h); g.strokeRect(0, h / 2, w, 0); });
  gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(50, 50); gt.anisotropy = 8;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({map:gt}));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);
  // horizon haze
  const hz = new THREE.Mesh(new THREE.PlaneGeometry(220, 30), new THREE.MeshBasicMaterial({fog:false, transparent:true, depthWrite:false,
    map:canvasTex(8, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.75, 'rgba(59,111,209,.55)');
      gr.addColorStop(.92, 'rgba(90,209,255,.9)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); })}));
  hz.position.set(0, 6, -60); scene.add(hz);
  scene.add(new THREE.AmbientLight(0x334466, .6));
  return {grid:gt};
}
// the playoff line as a light wall between 4th and 5th
function lightWall(scene, color){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(.09, 1), new THREE.MeshBasicMaterial({color, transparent:true, opacity:.95, fog:false, side:THREE.DoubleSide}));
  m.rotation.y = Math.PI / 2; const geo = new THREE.PlaneGeometry(3.6, 1);
  const wall = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color, transparent:true, opacity:.22, side:THREE.DoubleSide, depthWrite:false, fog:false,
    blending:THREE.AdditiveBlending}));
  wall.rotation.y = Math.PI / 2; scene.add(wall);
  const gx = (X(PO - 1) + X(PO)) / 2;
  const top = new THREE.Mesh(new THREE.BoxGeometry(.05, .05, 3.2), new THREE.MeshBasicMaterial({color, fog:false})); scene.add(top);
  const lab = sprite(textTex('PLAYOFF LINE', hex(color), '600 26px Orbitron'), 2, .75); scene.add(lab);
  return (k) => { const h = 5.4 * k; wall.scale.y = Math.max(.001, h); wall.position.set(gx, h / 2, 0); top.position.set(gx, h, 0);
    lab.position.set(gx, h + .55, 0); lab.material.opacity = k; };
}
// faces + odds live in their own scene (OVER), drawn after the bloom pass,
// so the glow never washes them out
const OVER = new Map();
function faces(scene, ringFor){
  const over = OVER.get(scene);
  return D.map((d, i) => { const m = innerWidth < 700 ? 1.3 : 1;   // a phone gets bigger faces and pills
    const f = sprite(faceTex(d.img, ringFor(d, i)), 1.2 * m, 1.2 * m, {depthTest:false});
    const l = sprite(pillTex(d.po + '%', d.first, ringFor(d, i)), 1.38 * m, .65 * m, {depthTest:false});
    over.add(f, l); return {f, l}; });
}
// a glass tower with neon edges, scaled by .scale.y
function neonBox(color, w){
  const g = new THREE.BoxGeometry(w || .82, 1, w || .82); g.translate(0, .5, 0);
  const grp = new THREE.Group();
  grp.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:0x02050e, metalness:.9, roughness:.15, transparent:true, opacity:.82, emissive:color, emissiveIntensity:.2})));
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({color})));
  // a second, slightly larger set of edges reads as a thicker neon tube once bloom hits it
  const outer = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({color, transparent:true, opacity:.55}));
  outer.scale.set(1.035, 1.0, 1.035); grp.add(outer);
  // light strips running up each face
  [[0, .415], [0, -.415]].forEach(([x, z]) => { const strip = new THREE.Mesh(new THREE.PlaneGeometry(.05, 1), new THREE.MeshBasicMaterial({color, transparent:true, opacity:.8}));
    strip.position.set(x, .5, z); if (z < 0) strip.rotation.y = Math.PI; grp.add(strip); });
  const cap = new THREE.Mesh(new THREE.PlaneGeometry((w || .82) * .96, (w || .82) * .96), new THREE.MeshBasicMaterial({color, transparent:true, opacity:.75}));
  cap.rotation.x = -Math.PI / 2; cap.position.y = 1.001; grp.add(cap);
  return grp;
}
// a light cycle on a loop, dragging a ribbon of light behind it
function lightCycle(scene, color, path, speed, len){
  const n = len || 70, pts = [], geo = new THREE.BufferGeometry(), pos = new Float32Array(n * 2 * 3);
  const idx = []; for (let i = 0; i < n - 1; i++){ const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  geo.setIndex(idx); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const trail = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color, transparent:true, opacity:.42, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false}));
  trail.frustumCulled = false; scene.add(trail);
  const bike = new THREE.Mesh(new THREE.BoxGeometry(.5, .22, .2), new THREE.MeshBasicMaterial({color})); scene.add(bike);
  return (t) => {
    const p = path(t * speed); bike.position.set(p.x, .12, p.z);
    const q = path(t * speed - .01); bike.lookAt(q.x, .12, q.z); bike.rotateY(Math.PI / 2);
    pts.unshift(p.clone()); if (pts.length > n) pts.pop();
    for (let i = 0; i < n; i++){ const v = pts[Math.min(i, pts.length - 1)]; pos.set([v.x, 0, v.z, v.x, .26, v.z], i * 6); }
    geo.attributes.position.needsUpdate = true;
  };
}
const rectPath = (w, d) => (u) => { u = ((u % 1) + 1) % 1; const L = 2 * (w + d), s = u * L;
  if (s < w) return new THREE.Vector3(-w / 2 + s, 0, d / 2); if (s < w + d) return new THREE.Vector3(w / 2, 0, d / 2 - (s - w));
  if (s < 2 * w + d) return new THREE.Vector3(w / 2 - (s - w - d), 0, -d / 2); return new THREE.Vector3(-w / 2, 0, -d / 2 + (s - 2 * w - d)); };
const ovalPath = (rx, rz) => (u) => new THREE.Vector3(Math.cos(u * Math.PI * 2) * rx, 0, Math.sin(u * Math.PI * 2) * rz);


// ---- the reigning champion as a hologram; HOLO picks the look ----
let HOLO = 'cyan';
const HOLO_FRAG = `uniform sampler2D map; uniform float t; uniform float reveal; uniform vec3 lo; uniform vec3 hi; uniform float glitch; varying vec2 vUv;
  float h1(float n){ return fract(sin(n) * 43758.5453); }
  void main(){
    vec2 uv = vUv;
    // glitch: in bursts, slices of him jump sideways and the colour channels split
    float burst = glitch * step(.78, h1(floor(t * 6.)));
    float slice = floor(uv.y * 36.);
    uv.x += (h1(slice + floor(t * 24.)) - .5) * .09 * burst;
    vec4 c = texture2D(map, uv);
    float r = texture2D(map, uv + vec2(.008, 0.) * (glitch * .4 + burst)).a, bl = texture2D(map, uv - vec2(.008, 0.) * (glitch * .4 + burst)).a;
    float a = max(c.a, max(r, bl) * glitch);
    if (a < .03 || vUv.y > reveal) discard;
    float l = dot(c.rgb, vec3(.3, .59, .11));
    float scan = .62 + .38 * step(.5, fract(vUv.y * 170. - t * 2.2));
    float sweep = smoothstep(.035, 0., abs(vUv.y - fract(t * .25)));
    vec3 col = mix(lo, hi, pow(l, .8)) * scan * .95 + hi * sweep * .45;
    col.r += (r - c.a) * glitch * .9; col.b += (bl - c.a) * glitch * .9;
    float edge = smoothstep(.0, .45, vUv.y);
    float rise = smoothstep(reveal - .06, reveal, vUv.y) * 1.5;             // a bright band where he's still being drawn
    gl_FragColor = vec4(col + hi * rise, a * (.88 + .07 * sin(t * 31.)) * (.3 + .7 * edge));
  }`;
const PAL = {cyan:[[.02,.22,.62],[.62,.96,1.]], gold:[[.16,.08,.0],[.78,.58,.22]], glitch:[[.02,.22,.62],[.62,.96,1.]],
             beam:[[.02,.22,.62],[.62,.96,1.]], points:[[.02,.22,.62],[.62,.96,1.]], ring:[[.02,.22,.62],[.62,.96,1.]]};
function champion(scene, over){
  const look = HOLO, [lo, hi] = PAL[look];
  const hiC = new THREE.Color(hi[0], hi[1], hi[2]);
  const h = 10.8, w = h * CHAMP.w / CHAMP.h, X0 = innerWidth < 700 ? -3 : -4.6, Z0 = -11;
  const grp = new THREE.Group(); grp.position.set(X0, -.6, Z0); scene.add(grp);
  const ticks = [];
  let mat = null;
  if (look !== 'points'){
    const tex = new THREE.TextureLoader().load(CHAMP.img);
    // normal blending: he covers the sun behind him instead of adding to it (additive + bloom blew him out to white)
    mat = new THREE.ShaderMaterial({transparent:true, depthWrite:false, fog:false,
      uniforms:{map:{value:tex}, t:{value:0}, reveal:{value:0}, lo:{value:new THREE.Vector3(...lo)}, hi:{value:new THREE.Vector3(...hi)},
                glitch:{value:look === 'glitch' ? 1 : 0}},
      vertexShader:'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
      fragmentShader:HOLO_FRAG});
    const geo = new THREE.PlaneGeometry(w, h); geo.translate(0, h / 2, 0);
    grp.add(new THREE.Mesh(geo, mat));
  } else {
    // a point cloud: every few pixels of the cutout becomes a point that flies in and settles
    const img = new Image(); img.src = CHAMP.img;
    img.onload = () => {
      const c = document.createElement('canvas'), W = 150, Hh = Math.round(150 * CHAMP.h / CHAMP.w); c.width = W; c.height = Hh;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, W, Hh); const px = g.getImageData(0, 0, W, Hh).data;
      const tgt = [], col = [];
      for (let y = 0; y < Hh; y++) for (let x = 0; x < W; x++){ const k = (y * W + x) * 4; if (px[k + 3] < 140) continue;
        const l = (px[k] * .3 + px[k + 1] * .59 + px[k + 2] * .11) / 255;
        tgt.push((x / W - .5) * w, (1 - y / Hh) * h, 0); col.push(lo[0] + (hi[0] - lo[0]) * l, lo[1] + (hi[1] - lo[1]) * l, lo[2] + (hi[2] - lo[2]) * l); }
      const n = tgt.length / 3, pos = new Float32Array(n * 3), from = new Float32Array(n * 3);
      for (let i = 0; i < n * 3; i += 3){ from[i] = (rand() - .5) * 30; from[i + 1] = rand() * 16; from[i + 2] = (rand() - .5) * 20; }
      const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(col), 3));
      const pts = new THREE.Points(geo, new THREE.PointsMaterial({size:.085, vertexColors:true, transparent:true, opacity:.95,
        blending:THREE.AdditiveBlending, depthWrite:false, fog:false}));
      grp.add(pts);
      ticks.push((t) => { for (let i = 0; i < n * 3; i += 3){ const d = Math.min(1, Math.max(0, (t - .2 - (tgt[i + 1] / h) * .9) / 1.4)), e = ease(d);
          const jit = Math.sin(t * 3 + i) * .015;
          pos[i] = from[i] + (tgt[i] - from[i]) * e + jit; pos[i + 1] = from[i + 1] + (tgt[i + 1] - from[i + 1]) * e; pos[i + 2] = from[i + 2] + (tgt[i + 2] - from[i + 2]) * e + jit; }
        geo.attributes.position.needsUpdate = true; });
    };
  }
  // every look stands on a projector pad
  const pad = new THREE.Mesh(new THREE.CircleGeometry(w * .62, 64), new THREE.MeshBasicMaterial({color:hiC, transparent:true, opacity:.55,
    blending:THREE.AdditiveBlending, depthWrite:false, fog:false, map:canvasTex(256, 256, (g) => { const gr = g.createRadialGradient(128,128,10,128,128,128);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(.6, 'rgba(255,255,255,.35)'); gr.addColorStop(.95, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 256); })}));
  pad.rotation.x = -Math.PI / 2; pad.position.y = .62; grp.add(pad);
  if (look === 'beam' || look === 'gold'){
    // a cone of light from the pad up through him, and rings riding up the beam
    const cone = new THREE.Mesh(new THREE.CylinderGeometry(w * .62, w * .42, h * 1.02, 48, 1, true), new THREE.MeshBasicMaterial({color:hiC, transparent:true,
      opacity:look === 'gold' ? .045 : .06, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false, fog:false,
      map:canvasTex(8, 256, (g) => { const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, '#ffffff'); g.fillStyle = gr; g.fillRect(0, 0, 8, 256); })}));
    cone.position.y = h / 2 + .62; grp.add(cone);
    const rings = [0, 1, 2].map(i => { const r = new THREE.Mesh(new THREE.TorusGeometry(w * .55, .03, 8, 96), new THREE.MeshBasicMaterial({color:hiC, transparent:true,
      blending:THREE.AdditiveBlending, depthWrite:false, fog:false})); r.rotation.x = Math.PI / 2; grp.add(r); return r; });
    ticks.push((t) => rings.forEach((r, i) => { const u = ((t * .22 + i / 3) % 1); r.position.y = .62 + u * h; r.material.opacity = Math.sin(u * Math.PI) * (look === 'gold' ? .55 : .8);
      r.scale.setScalar(1 - u * .3); }));
  }
  if (look === 'ring'){
    // CHAMPION text orbiting his chest, and a spinning wireframe trophy at his feet
    const txt = canvasTex(2048, 160, (g, W, Hh) => { g.font = '800 92px Orbitron'; g.textBaseline = 'middle';
      g.fillStyle = '#ffffff'; g.shadowColor = '#5ad1ff'; g.shadowBlur = 18; g.fillText('2025 CHAMPION  ·  TANNER  ·  ', 0, Hh / 2); });
    txt.wrapS = THREE.RepeatWrapping; txt.repeat.set(2, 1);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(w * .62, w * .62, 1.0, 96, 1, true), new THREE.MeshBasicMaterial({map:txt, transparent:true,
      color:0x9ff0ff, side:THREE.DoubleSide, depthWrite:false, depthTest:false, fog:false}));
    band.position.y = h * .52; grp.add(band);
    const prof = [[0,0],[.5,0],[.5,.1],[.12,.25],[.1,.6],[.3,.75],[.55,1.2],[.6,1.55],[0,1.4]].map(([x, y]) => new THREE.Vector2(x, y));
    const cup = new THREE.Mesh(new THREE.LatheGeometry(prof, 24), new THREE.MeshBasicMaterial({color:0xf0c35e, wireframe:true, transparent:true, opacity:.8,
      blending:THREE.AdditiveBlending, fog:false}));
    cup.position.set(w * .75, .62, .6); cup.scale.setScalar(1.3); grp.add(cup);
    ticks.push((t) => { band.rotation.y = -t * .45; cup.rotation.y = t * .8; });
  }
  // the banner
  const ban = sprite(canvasTex(640, 200, (g, W, Hh) => {
      g.textAlign = 'center'; g.shadowColor = '#f0c35e'; g.shadowBlur = 18; g.fillStyle = '#f0c35e'; g.font = '800 54px Orbitron'; g.fillText(CHAMP.title, W / 2, 78);
      g.shadowBlur = 0; g.fillStyle = '#e8f6ff'; g.font = '600 34px Orbitron'; g.fillText(CHAMP.sub, W / 2, 138); }), 4.6, 1.44, {depthTest:false});
  if (look !== 'ring') over.add(ban);
  return (t) => { const k = Math.min(1, Math.max(0, (t - .1) / 2.2));
    if (mat){ mat.uniforms.t.value = t; mat.uniforms.reveal.value = ease(k) * 1.02; }
    pad.material.opacity = (look === 'gold' ? .5 : 1) * (.25 + .3 * Math.min(1, t * 2) + .05 * Math.sin(t * 9));
    ticks.forEach(f => f(t));
    ban.position.set(3.4, 9.2, -11); ban.material.opacity = Math.min(1, Math.max(0, (t - 1.8) * 1.5)); };
}

/* ---------- the scene: Legacy horizon, light cycles, playoff towers ---------- */
const TAKES = {
  combo(scene){
    const w = gridWorld(scene, {far:70});
    const mg = new THREE.PlaneGeometry(160, 26, 80, 13); const p = mg.attributes.position;
    for (let i = 0; i < p.count; i++){ const x = p.getX(i), y = p.getY(i); const ridge = (y + 13) / 26;
      p.setZ(i, (Math.sin(x * .17) * 4 + Math.sin(x * .41 + 1.3) * 2.2 + rand() * 1.4) * ridge * Math.min(1, Math.abs(x) / 20 + .25)); }
    const mtn = new THREE.Mesh(mg, new THREE.MeshBasicMaterial({color:0x3b6fd1, wireframe:true, transparent:true, opacity:.55, fog:false}));
    mtn.rotation.x = -Math.PI / 2 + .02; mtn.position.set(0, -.2, -48); scene.add(mtn);
    const sun = new THREE.Mesh(new THREE.CircleGeometry(9, 64), new THREE.MeshBasicMaterial({fog:false, transparent:true,
      map:canvasTex(256, 256, (g, ww, hh) => { const gr = g.createLinearGradient(0, 0, 0, hh); gr.addColorStop(0, '#fff1c4'); gr.addColorStop(.6, '#f0c35e'); gr.addColorStop(1, '#c46a1e');
        g.fillStyle = gr; g.beginPath(); g.arc(128, 128, 126, 0, Math.PI * 2); g.fill(); g.globalCompositeOperation = 'destination-out';
        for (let i = 0; i < 8; i++) g.fillRect(0, 140 + i * 15, ww, 3 + i * 1.3); })}));
    sun.position.set(0, 7, -62); scene.add(sun);
    const T = D.map((d, i) => { const b = neonBox(colOf(d, i)); b.position.x = X(i); b.scale.y = .001; scene.add(b); return b; });
    const champ = CHAMP ? champion(scene, OVER.get(scene)) : () => {};
    const F = faces(scene, (d, i) => hex(colOf(d, i))); const wall = lightWall(scene, GOLD);
    // pink, blue and yellow cycles on three different loops
    const cyc = [lightCycle(scene, 0xff4fa3, rectPath(17, 8), .06, 90), lightCycle(scene, 0x4fb8ff, rectPath(20, 10.5), -.045, 90),
                 lightCycle(scene, 0xffd54a, ovalPath(12, 6), .042, 90)];
    return (t) => { w.grid.offset.y = -t * .35; champ(t);
      D.forEach((d, i) => { const k = Math.min(1, Math.max(0, (t - .2 - i * .12) / 1.1)), h = H(d) * easeBack(k);
        T[i].scale.y = Math.max(.001, h); const m = innerWidth < 700 ? 1.3 : 1;
        F[i].f.position.set(X(i), h + .75 * m, 0); F[i].l.position.set(X(i), h + 1.72 * m, 0);
        F[i].f.material.opacity = F[i].l.material.opacity = Math.min(1, k * 2); });
      wall(ease(Math.min(1, Math.max(0, (t - 1.2) / .8)))); cyc.forEach(c => c(t)); };
  },
};

/* ---------- one renderer per take, bloom when the post-processing scripts loaded ---------- */
function build(el, key){
  const r = new THREE.WebGLRenderer({antialias:true}); r.setPixelRatio(Math.min(innerWidth < 700 ? 1 : 1.5, devicePixelRatio || 1));
  r.setSize(el.clientWidth, el.clientHeight); el.appendChild(r.domElement);
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40, el.clientWidth / el.clientHeight, .1, 300);
  const over = new THREE.Scene(); OVER.set(scene, over);
  HOLO = el.dataset.holo || 'cyan';
  const tick = TAKES[key](scene);
  let comp = null, bloom = null;
  if (THREE.EffectComposer && THREE.UnrealBloomPass){
    comp = new THREE.EffectComposer(r); comp.addPass(new THREE.RenderPass(scene, cam));
    bloom = new THREE.UnrealBloomPass(new THREE.Vector2(el.clientWidth, el.clientHeight), 1.05, .5, .3); comp.addPass(bloom);
  }
  let yaw = 0, drag = null, t0 = performance.now(), raf = 0, on = false;
  el.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:yaw}; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if (drag) yaw = drag.y + (e.clientX - drag.x) * .006; });
  el.addEventListener('pointerup', () => { drag = null; });
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now){
    const t = still ? 6 : (now - t0) / 1000;
    if (!drag) yaw *= .985;
    const a = Math.sin(t * .2) * .45 + yaw;
    // a tall phone frame pulls the camera back so every tower fits; a wide desktop strip brings it in
    const R = 15.5 * Math.min(1.9, Math.max(.7, 1.55 / cam.aspect));
    cam.position.set(Math.sin(a) * R, 5 + R * .1 + Math.sin(t * .35) * .3, Math.cos(a) * R); cam.lookAt(0, 3.4, -2);
    tick(t);
    r.autoClear = true; comp ? comp.render() : r.render(scene, cam);
    r.autoClear = false; r.clearDepth(); r.render(over, cam); r.autoClear = true;
    if (on && !still && !document.hidden) raf = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && on && !still) raf = requestAnimationFrame(frame); });
  el.addEventListener('dblclick', () => { t0 = performance.now(); });
  onVisible(el, () => { if (!on){ on = true; raf = requestAnimationFrame(frame); } }, () => { on = false; cancelAnimationFrame(raf); });
  addEventListener('resize', () => { r.setSize(el.clientWidth, el.clientHeight); comp && comp.setSize(el.clientWidth, el.clientHeight);
    cam.aspect = el.clientWidth / el.clientHeight; cam.updateProjectionMatrix(); });
}
Promise.all(['58px Orbitron', '600 26px Orbitron', '76px Anton'].map(f => document.fonts.load(f))).catch(() => {})
  .then(() => document.querySelectorAll('.stage[data-take]').forEach(el => build(el, el.dataset.take)));
</script>
